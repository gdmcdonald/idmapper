url: https://gdmcdonald.github.io/idmapper/

template:
  bootstrap: 5

reference:
- title: Setup
  desc: >
    Initialise (or reset) an identity graph for one or more entity types
    (e.g. "person", "project").
  contents:
  - init_id_envs

- title: Building the identity graph
  desc: >
    Tag identifier columns, then add each dataset's identifiers - and
    their co-occurrences - to the graph.
  contents:
  - mark_id
  - add_to_identity_graph

- title: Resolving identities
  desc: >
    Collapse the graph's connected components into master identities, and
    retrieve the resulting table.
  contents:
  - generate_master_identity_table
  - get_master_table

- title: Using resolved identities
  desc: >
    Attach a resolved master ID to any marked dataset, or restrict a new
    dataset to identities already known to the graph.
  contents:
  - join_master_ids
  - filter_by_existing_identities
