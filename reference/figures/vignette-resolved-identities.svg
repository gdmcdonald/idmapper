<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idmapper-vignette-title idmapper-vignette-desc">
<title id="idmapper-vignette-title">Four resolved identities from the vignette's three datasets</title>
<desc id="idmapper-vignette-desc">Four cards, one per runner, each showing which identifier types (email, username, member_id) were collapsed into that single resolved identity. Sam Okafor's card shows two distinct email values resolving to one identity.</desc>

<style>
  .panel { fill: #F1EFE8; stroke: #5F5E5A; }
  .chip { fill: #FAECE7; stroke: #993C1D; }
  .title { font: 500 14px sans-serif; fill: #2C2C2A; }
  .label { font: 400 12px sans-serif; fill: #4A1B0C; }
  .caption { font: 400 12px sans-serif; fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .panel { fill: #2C2C2A; stroke: #B4B2A9; }
    .chip { fill: #712B13; stroke: #F0997B; }
    .title { fill: #F1EFE8; }
    .label { fill: #F5C4B3; }
    .caption { fill: #B4B2A9; }
  }
</style>

<rect class="panel" x="30" y="40" width="300" height="140" rx="12" stroke-width="0.5"/>
<text class="title" x="46" y="68">Jordan Blake</text>
<rect class="chip" x="54" y="86" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="94" y="102" text-anchor="middle">email</text>
<rect class="chip" x="140" y="86" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="180" y="102" text-anchor="middle">username</text>
<rect class="chip" x="226" y="86" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="266" y="102" text-anchor="middle">member_id</text>

<rect class="panel" x="350" y="40" width="300" height="140" rx="12" stroke-width="0.5"/>
<text class="title" x="366" y="68">Sam Okafor</text>
<rect class="chip" x="395" y="86" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="445" y="102" text-anchor="middle">email 1</text>
<rect class="chip" x="505" y="86" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="555" y="102" text-anchor="middle">email 2</text>
<rect class="chip" x="395" y="120" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="445" y="136" text-anchor="middle">username</text>
<rect class="chip" x="505" y="120" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="555" y="136" text-anchor="middle">member_id</text>

<rect class="panel" x="30" y="200" width="300" height="140" rx="12" stroke-width="0.5"/>
<text class="title" x="46" y="228">Nora Fitzgerald</text>
<rect class="chip" x="75" y="246" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="125" y="262" text-anchor="middle">email</text>
<rect class="chip" x="185" y="246" width="100" height="24" rx="8" stroke-width="0.5"/><text class="label" x="235" y="262" text-anchor="middle">member_id</text>

<rect class="panel" x="350" y="200" width="300" height="140" rx="12" stroke-width="0.5"/>
<text class="title" x="366" y="228">Yusuf Demir</text>
<rect class="chip" x="374" y="246" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="414" y="262" text-anchor="middle">email</text>
<rect class="chip" x="460" y="246" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="500" y="262" text-anchor="middle">username</text>
<rect class="chip" x="546" y="246" width="80" height="24" rx="8" stroke-width="0.5"/><text class="label" x="586" y="262" text-anchor="middle">member_id</text>

<text class="caption" x="340" y="360" text-anchor="middle">Sam Okafor&#8217;s two different emails resolve to one person_UID</text>
</svg>
